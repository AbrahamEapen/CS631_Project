{% extends "base.html" %}
{% block title %}Transfer Funds – Banking System{% endblock %}
{% block content %}
<h4 class="mb-4">💸 Transfer Funds</h4>

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm p-4">
      <h5 class="mb-3">Send Money Between Accounts</h5>

      <div class="mb-3">
        <label class="form-label">From Account #</label>
        <input type="number" id="fromAccount" class="form-control" placeholder="e.g. 1001">
      </div>
      <div class="mb-3">
        <label class="form-label">To Account #</label>
        <input type="number" id="toAccount" class="form-control" placeholder="e.g. 1002">
      </div>
      <div class="mb-3">
        <label class="form-label">Amount ($)</label>
        <input type="number" id="amount" class="form-control" min="0.01" step="0.01" placeholder="0.00">
      </div>

      <div id="transferError" class="alert alert-danger d-none"></div>
      <div id="transferSuccess" class="alert alert-success d-none"></div>

      <div class="d-grid">
        <button class="btn btn-warning fw-bold" onclick="submitTransfer()">Transfer</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function submitTransfer() {
  const fromAccount = parseInt(document.getElementById('fromAccount').value);
  const toAccount = parseInt(document.getElementById('toAccount').value);
  const amount = parseFloat(document.getElementById('amount').value);
  const errDiv = document.getElementById('transferError');
  const okDiv = document.getElementById('transferSuccess');
  errDiv.classList.add('d-none');
  okDiv.classList.add('d-none');

  if (!fromAccount || !toAccount || !amount) {
    errDiv.textContent = 'Please fill in all fields.';
    errDiv.classList.remove('d-none');
    return;
  }

  const res = await fetch('/transactions/transfer', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({from_account_number: fromAccount, to_account_number: toAccount, amount})
  });
  const data = await res.json();
  if (res.ok) {
    okDiv.textContent = `Transfer successful! Transaction IDs: #${data.debit_transaction_id} / #${data.credit_transaction_id}`;
    okDiv.classList.remove('d-none');
    document.getElementById('fromAccount').value = '';
    document.getElementById('toAccount').value = '';
    document.getElementById('amount').value = '';
  } else {
    errDiv.textContent = data.error || 'Transfer failed';
    errDiv.classList.remove('d-none');
  }
}
</script>
{% endblock %}
