{% extends "base.html" %}
{% block title %}All Transactions – Admin{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4>📋 All Transactions</h4>
  <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <div id="tx-loading" class="p-4 text-muted">Loading transactions…</div>
    <div class="table-responsive d-none" id="tx-table-wrap">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr><th>Tx ID</th><th>Account #</th><th>Type</th><th>Amount</th><th>Date</th></tr>
        </thead>
        <tbody id="tx-tbody"></tbody>
      </table>
    </div>
    <div id="tx-error" class="p-4 text-danger d-none"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
fetch('/admin/api/transactions')
  .then(r => {
    if (!r.ok) throw new Error('Status ' + r.status);
    return r.json();
  })
  .then(txs => {
    document.getElementById('tx-loading').remove();
    document.getElementById('tx-table-wrap').classList.remove('d-none');
    const tbody = document.getElementById('tx-tbody');
    if (!txs.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No transactions found.</td></tr>';
      return;
    }
    const colorMap = {DEP: 'success', WIT: 'danger', TRF: 'primary'};
    tbody.innerHTML = txs.map(t => `
      <tr>
        <td>#${t.id}</td>
        <td>#${t.account_number}</td>
        <td><span class="badge bg-${colorMap[t.type] || 'secondary'}">${t.type}</span></td>
        <td class="fw-semibold">$${parseFloat(t.amount).toFixed(2)}</td>
        <td>${t.date || '—'}</td>
      </tr>`).join('');
  })
  .catch(err => {
    document.getElementById('tx-loading').classList.add('d-none');
    const el = document.getElementById('tx-error');
    el.textContent = 'Failed to load transactions: ' + err.message;
    el.classList.remove('d-none');
  });
</script>
{% endblock %}
