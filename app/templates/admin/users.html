{% extends "base.html" %}
{% block title %}User List – Admin{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4>👥 Registered Users</h4>
  <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm">← Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <div id="users-loading" class="p-4 text-muted">Loading users…</div>
    <div class="table-responsive d-none" id="users-table-wrap">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Registered</th><th>Action</th></tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
    <div id="users-error" class="p-4 text-danger d-none"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
fetch('/admin/api/users')
  .then(r => {
    if (!r.ok) throw new Error('Status ' + r.status);
    return r.json();
  })
  .then(users => {
    document.getElementById('users-loading').remove();
    document.getElementById('users-table-wrap').classList.remove('d-none');
    const tbody = document.getElementById('users-tbody');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No users found.</td></tr>';
      return;
    }
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td><strong>${u.username}</strong></td>
        <td>${u.email || '—'}</td>
        <td><span class="badge bg-${u.role === 'admin' ? 'danger' : 'primary'}">${u.role}</span></td>
        <td>${u.created_at ? u.created_at.split('T')[0] : '—'}</td>
        <td>
          ${u.role !== 'admin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>` : '—'}
        </td>
      </tr>`).join('');
  })
  .catch(err => {
    document.getElementById('users-loading').classList.add('d-none');
    const el = document.getElementById('users-error');
    el.textContent = 'Failed to load users: ' + err.message;
    el.classList.remove('d-none');
  });

function deleteUser(userId, username) {
  if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
  fetch(`/admin/api/users/${userId}`, { method: 'DELETE' })
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      if (ok) {
        alert('User deleted successfully.');
        location.reload();
      } else {
        alert('Error: ' + data.error);
      }
    })
    .catch(err => alert('Request failed: ' + err.message));
}
</script>
{% endblock %}
