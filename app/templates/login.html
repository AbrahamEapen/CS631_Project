{% extends "base.html" %}
{% block title %}Login – Banking System{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm p-4">
      <h3 class="mb-4 text-center fw-bold">🔐 Sign In</h3>
      <form method="POST" action="/login">
        <div class="mb-3">
          <label class="form-label">Email / Username</label>
          <input type="text" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
      <hr>
      <p class="text-center mb-0">New user? <a href="/register">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
