version: '3.9'

services:

  db:
    image: postgres:15
    container_name: bank_db
    restart: always
    environment:
      POSTGRES_USER:     bank_user
      POSTGRES_PASSWORD: bank_pass
      POSTGRES_DB:       bank_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: bank_app
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bank_user:bank_pass@db:5432/bank_db
      JWT_SECRET:   cs631-jwt-secret
      SECRET_KEY:   cs631-flask-secret

  pgadmin:
    image: dpage/pgadmin4
    container_name: bank_pgadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: